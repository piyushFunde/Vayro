services:
  # Spring Boot Backend API
  - type: web
    name: vayro-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: APP_JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

  # React Frontend (Static Site on Render)
  - type: web
    name: vayro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vayro-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html


